<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background: #333;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .produkty {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .produkt {
            background: white;
            padding: 20px;
            width: 200px;
            border-radius: 8px;
            text-align: center;
        }

        .produkt img {
            width: 100%;
            height: 150px;
            object-fit: contain;
        }

        button {
            background: #007bff;
            color: white;
            border: 0;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
        }

        footer {
            margin-top: 40px;
            background: #111;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>ElectroShop</h1>
    <p>Sklep z elektroniką</p>
</header>

<nav>
    <a href="#">Strona główna</a>
    <a href="#produkty">Produkty</a>
    <a href="#kontakt">Kontakt</a>
</nav>

<main>
    <h2 id="produkty">Nasze produkty</h2>

    <div class="produkty">

        <div class="produkt">
            <img src="https://via.placeholder.com/200x150" alt="Smartfon">
            <h3>Smartfon</h3>
            <p>1499 zł</p>
            <button>Dodaj do koszyka</button>
        </div>

        <div class="produkt">
            <img src="https://via.placeholder.com/200x150" alt="Laptop">
            <h3>Laptop</h3>
            <p>2999 zł</p>
            <button>Dodaj do koszyka</button>
        </div>

        <div class="produkt">
            <img src="https://via.placeholder.com/200x150" alt="Słuchawki">
            <h3>Słuchawki</h3>
            <p>299 zł</p>
            <button>Dodaj do koszyka</button>
        </div>

        <div class="produkt">
            <img src="https://via.placeholder.com/200x150" alt="Smartwatch">
            <h3>Smartwatch</h3>
            <p>599 zł</p>
            <button>Dodaj do koszyka</button>
        </div>

    </div>

    <section id="kontakt">
        <h2>Kontakt</h2>
        <p>Email: kontakt@electroshop.pl</p>
        <p>Telefon: 123 456 789</p>
    </section>
</main>

<footer>
    <p>&copy; 2026 ElectroShop</p>
</footer>

</body>
</html>
