<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kocie Królestwo Poprawione 🐱</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            color: #33243d;
            background: linear-gradient(135deg, #ffd6e7, #d8c7ff, #bdefff);
        }

        header {
            text-align: center;
            padding: 50px 20px 35px;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1rem;
            color: #684d72;
        }

        .gallery {
            width: min(1100px, 90%);
            margin: 0 auto 50px;

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .cat-card {
            background: rgba(255, 255, 255, 0.75);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(80, 40, 100, 0.15);
            backdrop-filter: blur(8px);

            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .cat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 18px 35px rgba(80, 40, 100, 0.25);
        }

        .cat-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .cat-card .description {
            padding: 18px;
            text-align: center;
        }

        .cat-card h2 {
            font-size: 1.25rem;
            margin-bottom: 6px;
        }

        .cat-card p {
            color: #765c80;
            font-size: 0.95rem;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #684d72;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2.2rem;
            }

            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🐱 Kocie Królestwo</h1>
        <p>Mała galeria wielkich osobowości</p>
    </header>

    <main class="gallery" id="gallery"></main>

    <footer>
        <p>😻 Maksymalnie 5 kotków w galerii</p>
    </footer>

    <script>
        // Tutaj możesz zmienić zdjęcia i opisy.
        // Maksymalnie 5 elementów w tablicy.

        const cats = [
            {
                image: "https://placecats.com/500/400",
                name: "Mruczek",
                description: "Profesjonalny ekspert od drzemek."
            },
            {
                image: "https://placecats.com/501/400",
                name: "Luna",
                description: "Królowa kanapy 👑"
            },
            {
                image: "https://placecats.com/502/400",
                name: "Filemon",
                description: "Specjalista od patrzenia w pustkę."
            },
            {
                image: "https://placecats.com/503/400",
                name: "Kicia",
                description: "Mistrzyni słodkich minek."
            },
            {
                image: "https://placecats.com/504/400",
                name: "Pixel",
                description: "Mały kot, wielka osobowość."
            }
        ];

        const gallery = document.getElementById("gallery");

        // Bezpieczeństwo: wyświetlamy maksymalnie 5 zdjęć.
        cats.slice(0, 5).forEach(cat => {
            const card = document.createElement("article");
            card.className = "cat-card";

            card.innerHTML = `
                <img src="${cat.image}" alt="Zdjęcie kota ${cat.name}">
                <div class="description">
                    <h2>${cat.name}</h2>
                    <p>${cat.description}</p>
                </div>
            `;

            gallery.appendChild(card);
        });
    </script>

</body>
</html>
